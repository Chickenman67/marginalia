<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#23201b" />
  <meta name="description" content="A free voice/text planner that keeps what you need to do." />
  <!-- iPhone / iPad homescreen: standalone, dark status bar, no link preview -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Marginalia" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <title>Marginalia — schedule & todos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
</head>
<body>
  <div id="authRoot"></div>
  <div id="appRoot" hidden>
    <div class="app">
      <header>
        <h1>Marginalia</h1>
        <div class="user-menu" id="userMenu" tabindex="0">
          <span class="dot"></span><span id="userEmail">—</span>
          <div class="user-menu-pop" hidden>
            <button type="button" id="userSettings">Settings</button>
            <button type="button" id="userSignOut">Sign out</button>
          </div>
        </div>
        <button id="settingsBtn" class="icon gear-btn" title="Settings" aria-label="Settings">⚙</button>
      </header>

      <div class="tabs" role="tablist">
        <button class="tab" role="tab" aria-selected="true" data-view="schedule">Schedule <span class="count" id="cSched"></span></button>
        <button class="tab" role="tab" aria-selected="false" data-view="todos">Todos <span class="count" id="cTodo"></span></button>
        <button class="tab" role="tab" aria-selected="false" data-view="due">Due <span class="count" id="cDue"></span></button>
      </div>

      <main>
        <div id="view-schedule">
          <form class="manual-event" id="addEvent">
            <input id="evTitle" placeholder="Add to schedule — e.g. Dentist" aria-label="Event title" />
            <button type="button" class="picker-trigger" id="evDate">Pick a date</button>
            <button type="button" class="picker-trigger" id="evTimeTrigger">Time</button>
            <label class="allday"><input type="checkbox" id="evAllDay" /> All day</label>
            <button class="btn primary" type="submit">Add</button>
          </form>
          <div id="scheduleList"></div>
        </div>
        <div id="view-todos" hidden></div>
        <div id="view-due" hidden></div>
      </main>

      <div class="dock">
        <div class="dock-inner">
          <div class="dock-head">
            <button class="btn toggle" id="dictateToggle" aria-pressed="false">Dictate</button>
          </div>

          <div id="quick">
            <div class="preview" id="preview"><span id="previewText"></span><span class="x" id="previewX">✕</span></div>
            <div class="bar">
              <button class="mic" id="mic" title="Speak" aria-label="Speak">🎙</button>
              <input id="phrase" placeholder="Speak or type — “dentist Tuesday 3pm”, “call mom after lunch”" aria-label="New item" />
              <button class="btn primary" id="quickAdd">Add</button>
            </div>
          </div>

          <div id="dictate" hidden>
            <textarea id="para" rows="4" placeholder="Ramble away — “dentist Tuesday 3pm, call mom after lunch, pick up groceries tomorrow”"></textarea>
            <div class="dictate-bar">
              <button class="mic" id="paraMic" title="Speak" aria-label="Speak">🎙</button>
              <button class="btn primary" id="process">Process</button>
            </div>
            <div id="draft"></div>
          </div>

          <div class="hint" id="hint">Press <span class="kbd">Enter</span> to add · voice works in all modern browsers</div>
          <div class="demo-note"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="back" id="settingsModal">
    <div class="modal settings">
      <div class="tab-strip" role="tablist">
        <button class="stab" data-tab="general" role="tab" aria-selected="true">General</button>
        <button class="stab" data-tab="colors" role="tab" aria-selected="false">Colors</button>
        <button class="stab" data-tab="backup" role="tab" aria-selected="false">Backup</button>
      </div>
      <section class="spanel" data-panel="general">
        <p>Pick a provider. <b>NVIDIA</b> is free with no key (uses a shared proxy). Add a <b>Gemini</b> or <b>Groq</b> key for faster parsing.</p>
        <select id="provider">
          <option value="gemini">Gemini</option>
          <option value="groq">Groq</option>
          <option value="nvidia">NVIDIA (default, via proxy)</option>
        </select>
        <input id="apiKey" placeholder="Paste your API key" />
        <div class="row key-row">
          <button class="btn" id="keyTest" type="button">Test key</button>
          <span id="keyStatus" class="key-status"></span>
        </div>
        <label class="toggle"><input type="checkbox" id="setAutoRemind" /> Remind me at each event's time</label>
        <label class="toggle"><input type="checkbox" id="setNotify" /> Browser notifications (while app is open)</label>
        <label class="toggle"><input type="checkbox" id="setMilitary" /> Use 24-hour (military) time</label>
        <label class="toggle"><input type="checkbox" id="setAutoDelete" /> Auto-delete past events</label>
        <label class="toggle">Delete after <input type="number" id="autoDeleteDays" min="1" value="30" style="width:64px;margin:0 4px" /> days</label>
        <label class="toggle"><input type="checkbox" id="setDueIncludeOverdue" /> Include overdue items in Due tab</label>
        <label class="toggle">Due tab: show next <input type="number" id="setDueDaysAhead" min="1" max="365" value="7" style="width:64px;margin:0 4px" /> days</label>
        <div class="row">
          <button class="btn" id="settingsCancel">Close</button>
          <button class="btn primary" id="settingsSave">Save</button>
        </div>
      </section>
      <section class="spanel" data-panel="colors" hidden>
        <div class="rules-head">Color by due date <span class="muted">(most specific matching rule wins)</span></div>
        <div id="colorRules"></div>
        <button type="button" class="btn ghost" id="addRule">+ Add color rule</button>
      </section>
      <section class="spanel" data-panel="backup" hidden>
        <div class="rules-head">Backup</div>
        <div class="row">
          <button class="btn" id="exportCsv" type="button">Export CSV</button>
          <button class="btn" id="exportText" type="button">Export text</button>
        </div>
        <label class="toggle">Import a backup file</label>
        <input type="file" id="importFile" accept=".csv,.txt,text/plain" />
        <div class="row" id="importMode" hidden>
          <button class="btn" id="importMerge" type="button">Merge</button>
          <button class="btn primary" id="importReplace" type="button">Replace</button>
        </div>
        <div class="key-status" id="backupStatus"></div>
      </section>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
